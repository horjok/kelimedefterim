<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bugün · Kelime Defteri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1 class="brand"><span class="brand-mark" aria-hidden="true">K</span> Kelime Defteri</h1>
        <nav class="nav" aria-label="Sayfalar">
            <a href="index.html" aria-current="page">Bugün</a>
            <a href="kartlar.html">Kartlar</a>
            <a href="kelimeler.html">Kelimeler</a>
            <a href="pekistir.html">Pekiştir</a>
            <a href="kitaplik.html">Kitaplık</a>
            <a href="video.html">Video</a>
            <a href="sozluk.html">Sözlük</a>
            <a href="gramer.html">Gramer</a>
            <a href="ielts.html">IELTS</a>
        </nav>
    </aside>

    <main class="main">
        <section id="today" class="section">
            <h2><mark>Bugün</mark></h2>
            <p class="section-hint">Bugün çalışacakların, günün kelimesi ve kaldığın videolar.</p>

            <!-- Günün özeti: kayıtlı kartlardan (store.js + saved.js) -->
            <article class="panel hero">
                <div id="todayHero"></div>
                <div class="index-card">
                    <div id="todayNext" class="study-display today-next"></div>
                </div>
            </article>

            <!-- IELTS hedefi: yol haritası çıkarıldıysa görünür (saved.js renderTodayIelts) -->
            <a class="panel today-ielts" id="todayIelts" href="ielts.html#yol" hidden></a>

            <div class="tiles">
                <div class="tile"><span class="tile-label">Bugün çalışılan</span><span class="tile-value" id="todayDone">0</span><span class="tile-sub">kart</span></div>
                <div class="tile"><span class="tile-label">Seri</span><span class="tile-value"><span id="todayStreak">0</span> gün</span></div>
                <div class="tile"><span class="tile-label">Defterde</span><span class="tile-value" id="todayTotal">0</span><span class="tile-sub">kelime</span></div>
                <div class="tile"><span class="tile-label">Öğrenildi</span><span class="tile-value" id="todayLearned">0</span><span class="tile-sub">kelime</span></div>
            </div>

            <div class="grid grid-2">
                <article class="panel">
                    <h3>Günün kelimesi</h3>
                    <div id="todayWord"></div>
                </article>
                <article class="panel">
                    <h3>Videoların</h3>
                    <div id="todayVideos"></div>
                </article>
            </div>
        </section>
    </main>
</div>

<script src="js/helpers.js"></script>
<script src="js/course.js"></script>
<script src="js/store.js"></script>
<script src="js/saved.js"></script>
gg</body>
</html>
