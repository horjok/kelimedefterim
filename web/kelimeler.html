<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kelimeler · Kelime Defteri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1 class="brand"><span class="brand-mark" aria-hidden="true">K</span> Kelime Defteri</h1>
        <nav class="nav" aria-label="Sayfalar">
            <a href="index.html">Bugün</a>
            <a href="kartlar.html">Kartlar</a>
            <a href="kelimeler.html" aria-current="page">Kelimeler</a>
            <a href="pekistir.html">Pekiştir</a>
            <a href="kitaplik.html">Kitaplık</a>
            <a href="video.html">Video</a>
            <a href="sozluk.html">Sözlük</a>
            <a href="gramer.html">Gramer</a>
            <a href="ielts.html">IELTS</a>
        </nav>
    </aside>

    <main class="main">
        <section id="words" class="section">
            <h2><mark>Kelimeler</mark></h2>
            <p class="section-hint">Kelime defterin: videolardan kaydettiğin ve elle eklediğin tüm kelimeler. Ara, süz, çalışmak istediklerini karta çevir.</p>

            <!-- Defter özeti (saved.js renderWordStats) -->
            <div class="tiles">
                <div class="tile"><span class="tile-label">Toplam kelime</span><span class="tile-value" id="statTotal">0</span></div>
                <div class="tile"><span class="tile-label">Kartlarda</span><span class="tile-value" id="statCards">0</span></div>
                <div class="tile"><span class="tile-label">Öğrenildi</span><span class="tile-value" id="statLearned">0</span></div>
                <div class="tile"><span class="tile-label">Video</span><span class="tile-value" id="statVideos">0</span></div>
            </div>

            <!-- Kelime defteri (store.js + saved.js) -->
            <article class="panel notebook">
                <div class="word-tools">
                    <input type="text" id="wordSearch" placeholder="Kelime ya da anlam ara…" aria-label="Defterde ara" autocomplete="off">
                    <select id="wordLevel" aria-label="Seviye">
                        <option value="all">Tüm seviyeler</option>
                        <option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option>
                        <option value="phrasal">Phrasal verbs</option>
                    </select>
                    <select id="wordVideo" aria-label="Video"></select>
                    <select id="wordStatus" aria-label="Durum">
                        <option value="all">Hepsi</option>
                        <option value="cards">Kartlarda</option>
                        <option value="nocards">Kartlarda değil</option>
                        <option value="learned">Öğrenildi</option>
                    </select>
                    <select id="wordSort" aria-label="Sıralama">
                        <option value="new">En yeni</option>
                        <option value="az">A → Z</option>
                        <option value="level">Seviyeye göre</option>
                    </select>
                </div>
                <p class="word-info" id="savedListInfo"></p>
                <ul id="savedList" class="word-list"></ul>
            </article>

            <article class="panel word-add">
                <h3>Elle kelime ekle</h3>
                <form id="wordAddForm" class="word-add-form">
                    <input type="text" id="addWordText" placeholder="Kelime (ör. house)" aria-label="Kelime" autocomplete="off">
                    <input type="text" id="addWordMeaning" placeholder="Anlamı (ör. ev)" aria-label="Anlamı" autocomplete="off">
                    <label class="check"><input type="checkbox" id="addWordCard" checked> Karta da ekle</label>
                    <button type="submit">Deftere ekle</button>
                </form>
                <p id="wordAddResult"></p>
            </article>
        </section>
    </main>
</div>

<script src="js/helpers.js"></script>
<script src="js/lang.js"></script>
<script src="js/course.js"></script>
<script src="js/store.js"></script>
<script src="js/saved.js"></script>
</body>
</html>
